name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # docs/ is built by Mintlify, not by this site, so syncs from superfloat.python don't redeploy it
    paths-ignore: ["docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          CI: false
      # The build prerenders every page to dist/client/<path>/index.html (a real 200 with its own
      # head tags) and writes 404.html, so nothing is copied here.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
